<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HEV Suit 3D Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #110600; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #FF6600;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FF6600;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Loading HEV Suit...<br><small>Check console for errors</small></div>
    <div id="info">Tap suit parts to inspect & play sounds</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, controls;
        let model;
        let canRotate = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        init();
        animate();

        function init() {
            console.log('Initializing 3D viewer...');

            const container = document.createElement('div');
            document.body.appendChild(container);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3);

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x110600);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.8);
            backLight.position.set(-5, 5, -5);
            scene.add(backLight);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            console.log('Loading GLB model from: hev_suit.glb');

            // Load GLB model
            const loader = new GLTFLoader();
            loader.load('hev_suit.glb',
                function (gltf) {
                    console.log('Model loaded successfully');
                    model = gltf.scene;
                    scene.add(model);

                    // Auto-scale model to fit in view
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2.5 / maxDim;
                    model.scale.setScalar(scale);

                    // Center model
                    const center = box.getCenter(new THREE.Vector3());
                    model.position.sub(center.multiplyScalar(scale));

                    // Enable raycasting on all meshes
                    model.traverse(function (child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            console.log('Found mesh:', child.name);
                        }
                    });

                    // Hide loading text
                    document.getElementById('loading').style.display = 'none';

                },
                function (xhr) {
                    if (xhr.lengthComputable) {
                        const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                        console.log('Loading progress:', percent + '%');
                        document.getElementById('loading').innerHTML = 'Loading HEV Suit...<br>' + percent + '%';
                    }
                },
                function (error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loading').innerHTML = 'Error loading model<br><small>Check console for details</small>';
                }
            );

            // Controls - initially disabled
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1;
            controls.maxDistance = 10;
            controls.enabled = false; // Initially disabled

            // Events
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onClick);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onClick(event) {
            if (!model) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(model.children, true);

            if (intersects.length > 0) {
                const clickedPart = intersects[0].object;
                const partName = clickedPart.name || clickedPart.parent?.name || 'unknown';

                console.log('Clicked part:', partName);

                // Enable rotation/zoom when clicking a part
                canRotate = true;
                controls.enabled = true;

                // Send click event to Android
                if (window.AndroidInterface) {
                    window.AndroidInterface.onModelPartClicked(partName);
                }

                // Disable rotation after 5 seconds
                setTimeout(() => {
                    canRotate = false;
                    controls.enabled = false;
                }, 5000);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (canRotate) {
                controls.update();
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
